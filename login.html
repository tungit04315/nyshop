<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập · ShopViet</title>
    <meta name="description"
        content="Đăng nhập ShopViet để theo dõi đơn hàng, quản lý địa chỉ và nhận ưu đãi dành riêng cho thành viên." />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/shop-forms.css" />
    <link rel="stylesheet" href="css/auth-pages.css" />
</head>

<body data-page="login">

    <!-- ==================== HEADER (component) ==================== -->
    <header id="site-header"></header>

    <main>
        <section class="auth-banner">
            <div class="container">
                <div class="breadcrumb">
                    <a href="index.html">Trang chủ</a>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 6l6 6-6 6" />
                    </svg>
                    <span>Đăng nhập</span>
                </div>
                <h1 class="auth-banner__title">Chào mừng trở lại</h1>
                <p class="auth-banner__desc">Đăng nhập để tiếp tục mua sắm tại ShopViet.</p>
            </div>
        </section>

        <section class="auth-section">
            <div class="container">
                <div class="auth-shell" id="login-shell">

                    <!-- ---- FORM ĐĂNG NHẬP ---- -->
                    <div id="login-form-view">
                        <div class="auth-shell__icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4" />
                                <path d="M10 17l5-5-5-5" />
                                <path d="M15 12H3" />
                            </svg>
                        </div>
                        <div class="auth-shell__title">Đăng nhập</div>
                        <p class="auth-shell__subtitle">Nhập email và mật khẩu để truy cập tài khoản của bạn.</p>

                        <form id="login-form" novalidate>
                            <div class="form-group">
                                <label class="form-label" for="lf-email">Email</label>
                                <input type="email" id="lf-email" class="form-input" placeholder="ban@email.com"
                                    autocomplete="email" />
                                <div class="form-error" id="lf-email-error"></div>
                            </div>

                            <div class="form-group">
                                <div class="auth-form__top-row">
                                    <label class="form-label" for="lf-password" style="margin-bottom:0;">Mật
                                        khẩu</label>
                                    <button type="button" class="auth-form__forgot" id="lf-forgot-toggle">Quên mật
                                        khẩu?</button>
                                </div>
                                <div class="form-input-wrap">
                                    <input type="password" id="lf-password" class="form-input"
                                        placeholder="Nhập mật khẩu" autocomplete="current-password" />
                                    <button type="button" class="form-input-icon-btn" data-toggle-password="lf-password"
                                        aria-label="Hiện/ẩn mật khẩu">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                    </button>
                                </div>
                                <div class="form-error" id="lf-password-error"></div>
                            </div>

                            <label class="form-checkbox" style="margin-bottom:20px;">
                                <input type="checkbox" id="lf-remember" checked />
                                <span>Ghi nhớ đăng nhập trên thiết bị này</span>
                            </label>

                            <button type="submit" class="btn btn--accent" style="width:100%;justify-content:center;"
                                id="lf-submit-btn">
                                Đăng nhập
                            </button>
                        </form>

                        <div class="auth-shell__footer">
                            Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
                        </div>
                    </div>

                    <!-- ---- FORM QUÊN MẬT KHẨU (ẩn mặc định) ---- -->
                    <div id="login-forgot-view" style="display:none;">
                        <div class="auth-shell__icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="10" rx="2" />
                                <path d="M7 11V7a5 5 0 0110 0v4" />
                            </svg>
                        </div>
                        <div class="auth-shell__title">Quên mật khẩu</div>
                        <p class="auth-shell__subtitle">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật
                            khẩu.</p>

                        <form id="forgot-form" novalidate>
                            <div class="form-group">
                                <label class="form-label" for="ff-email">Email</label>
                                <input type="email" id="ff-email" class="form-input" placeholder="ban@email.com"
                                    autocomplete="email" />
                                <div class="form-error" id="ff-email-error"></div>
                            </div>
                            <button type="submit" class="btn btn--accent" style="width:100%;justify-content:center;"
                                id="ff-submit-btn">
                                Gửi liên kết đặt lại mật khẩu
                            </button>
                            <button type="button" class="btn btn--ghost"
                                style="width:100%;justify-content:center;margin-top:10px;" id="ff-back-btn">
                                Quay lại đăng nhập
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <!-- ==================== FOOTER (component) ==================== -->
    <footer id="site-footer"></footer>

    <script type="module" src="js/site-entry.js"></script>
</body>

</html>
