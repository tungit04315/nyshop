<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tra cứu đơn hàng · ShopViet</title>
    <meta name="description"
        content="Tra cứu tình trạng đơn hàng ShopViet nhanh chóng bằng số điện thoại hoặc email đã dùng khi đặt hàng." />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/shop-forms.css" />
    <link rel="stylesheet" href="css/auth-pages.css" />
    <link rel="stylesheet" href="css/order-lookup.css" />
</head>

<body data-page="order-lookup">

    <!-- ==================== HEADER (component) ==================== -->
    <header id="site-header"></header>

    <main>
        <section class="auth-banner">
            <div class="container">
                <div class="breadcrumb">
                    <a href="index.html">Trang chủ</a>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 6l6 6-6 6" />
                    </svg>
                    <span>Tra cứu đơn hàng</span>
                </div>
                <h1 class="auth-banner__title">Tra cứu đơn hàng</h1>
                <p class="auth-banner__desc">Nhập số điện thoại hoặc email đã dùng lúc đặt hàng để xem tình trạng đơn.</p>
            </div>
        </section>

        <section class="lookup-section">
            <div class="container">

                <!-- ---- FORM TRA CỨU ---- -->
                <form id="lookup-form" class="lookup-form" novalidate>
                    <div class="form-group lookup-form__field">
                        <label class="form-label" for="lk-keyword">Số điện thoại hoặc Email</label>
                        <input type="text" id="lk-keyword" class="form-input" placeholder="VD: 0987654321 hoặc ban@email.com"
                            autocomplete="tel" />
                        <div class="form-error" id="lk-keyword-error"></div>
                    </div>
                    <button type="submit" class="btn btn--accent lookup-form__submit" id="lk-submit-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <circle cx="11" cy="11" r="8" />
                            <path d="M21 21l-4.35-4.35" />
                        </svg>
                        Tra cứu
                    </button>
                </form>

                <!-- ---- KẾT QUẢ ---- -->
                <div id="lookup-results" class="lookup-results"></div>

            </div>
        </section>
    </main>

    <!-- ==================== FOOTER (component) ==================== -->
    <footer id="site-footer"></footer>

    <script type="module" src="js/site-entry.js"></script>
</body>

</html>
