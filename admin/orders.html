<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn hàng · ShopAdmin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/shared-components.css" />
    <link rel="stylesheet" href="../css/orders.css" />
</head>

<body data-page="orders">
    <div class="app-shell">
        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- ==================== MAIN ==================== -->
        <div class="main">
            <header class="header">
                <div>
                    <div class="header__title">Đơn hàng</div>
                    <div class="header__subtitle">Theo dõi và xử lý toàn bộ đơn hàng của khách.</div>
                </div>
                <div class="header__actions">
                    <button class="header__icon-btn" aria-label="Thông báo">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                        <span class="dot"></span>
                    </button>
                </div>
            </header>

            <div class="content">
                <div class="filter-bar">
                    <div class="filter-search">
                        <svg viewBox="0 0 24 24" fill="none">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
                            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <input type="text" id="order-search" placeholder="Tìm theo mã đơn, tên khách, SĐT..." />
                    </div>

                    <select class="filter-select" id="order-filter-status">
                        <option value="all">Tất cả trạng thái</option>
                        <option value="pending">Chờ xử lý</option>
                        <option value="confirmed">Đã xác nhận</option>
                        <option value="packing">Đang đóng gói</option>
                        <option value="shipping">Đang giao</option>
                        <option value="completed">Hoàn tất</option>
                        <option value="cancelled">Đã hủy</option>
                    </select>

                    <select class="filter-select" id="order-sort">
                        <option value="createdAt_desc">Mới nhất</option>
                        <option value="createdAt_asc">Cũ nhất</option>
                        <option value="total_desc">Giá trị giảm dần</option>
                        <option value="total_asc">Giá trị tăng dần</option>
                    </select>

                    <div class="page-toolbar__spacer"></div>
                </div>

                <div class="card card--flush">
                    <div class="table-toolbar" style="padding: 20px 20px 0;">
                        <div class="table-toolbar__count">
                            Hiển thị <strong id="order-count-shown">0</strong> / <strong id="order-count-total">0</strong>
                            đơn hàng
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Mã đơn</th>
                                    <th>Khách hàng</th>
                                    <th>Ngày đặt</th>
                                    <th>Tổng tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table-body">
                                <tr>
                                    <td colspan="6">
                                        <div class="skeleton" style="height: 20px;"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination" style="margin: 0 20px 20px;">
                        <div class="pagination__info" id="pagination-info">Trang 1</div>
                        <div class="pagination__controls" id="pagination-controls"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/entry.js"></script>
</body>

</html>
