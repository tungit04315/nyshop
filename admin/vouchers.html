<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voucher · ShopAdmin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/shared-components.css" />
    <link rel="stylesheet" href="../css/vouchers.css" />
</head>

<body data-page="vouchers">
    <div class="app-shell">
        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- ==================== MAIN ==================== -->
        <div class="main">
            <header class="header">
                <div>
                    <div class="header__title">Voucher</div>
                    <div class="header__subtitle">Quản lý mã giảm giá áp dụng cho đơn hàng.</div>
                </div>
                <div class="header__actions">
                    <button class="header__icon-btn" aria-label="Thông báo">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                        <span class="dot"></span>
                    </button>
                </div>
            </header>

            <div class="content">
                <div class="filter-bar">
                    <div class="filter-search">
                        <svg viewBox="0 0 24 24" fill="none">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
                            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <input type="text" id="voucher-search" placeholder="Tìm theo mã voucher..." />
                    </div>

                    <select class="filter-select" id="voucher-filter-status">
                        <option value="all">Tất cả trạng thái</option>
                        <option value="active">Đang bật</option>
                        <option value="inactive">Đang tắt</option>
                        <option value="expired">Đã hết hạn</option>
                    </select>

                    <div class="page-toolbar__spacer"></div>

                    <button type="button" class="btn btn--primary" id="btn-add-voucher">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2"
                                stroke-linecap="round" />
                        </svg>
                        Thêm voucher
                    </button>
                </div>

                <div class="card card--flush">
                    <div class="table-toolbar" style="padding: 20px 20px 0;">
                        <div class="table-toolbar__count">
                            Hiển thị <strong id="voucher-count-shown">0</strong> / <strong
                                id="voucher-count-total">0</strong> voucher
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Mã voucher</th>
                                    <th>Giá trị</th>
                                    <th>Áp dụng</th>
                                    <th>Thời gian</th>
                                    <th>Lượt dùng</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="vouchers-table-body">
                                <tr>
                                    <td colspan="7">
                                        <div class="skeleton" style="height: 20px;"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination" style="margin: 0 20px 20px;">
                        <div class="pagination__info" id="pagination-info">Trang 1</div>
                        <div class="pagination__controls" id="pagination-controls"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/entry.js"></script>
</body>

</html>
