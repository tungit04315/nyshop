<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm · ShopAdmin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/shared-components.css" />
    <link rel="stylesheet" href="../css/products.css" />
</head>

<body data-page="products">
    <div class="app-shell">
        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- ==================== MAIN ==================== -->
        <div class="main">
            <header class="header">
                <div>
                    <div class="header__title">Sản phẩm</div>
                    <div class="header__subtitle">Quản lý danh mục, kho hàng và hình ảnh sản phẩm.</div>
                </div>
                <div class="header__actions">
                    <button class="header__icon-btn" aria-label="Thông báo">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                        <span class="dot"></span>
                    </button>
                </div>
            </header>

            <div class="content">
                <!-- ---- Filter bar ---- -->
                <div class="filter-bar">
                    <div class="filter-search">
                        <svg viewBox="0 0 24 24" fill="none">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
                            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <input type="text" id="product-search" placeholder="Tìm theo tên hoặc SKU..." />
                    </div>

                    <select class="filter-select" id="product-filter-category">
                        <option value="all">Tất cả danh mục</option>
                    </select>

                    <select class="filter-select" id="product-filter-status">
                        <option value="all">Tất cả trạng thái</option>
                        <option value="active">Đang bán</option>
                        <option value="inactive">Ngừng bán</option>
                        <option value="out_of_stock">Hết hàng</option>
                    </select>

                    <select class="filter-select" id="product-sort">
                        <option value="createdAt_desc">Mới nhất</option>
                        <option value="createdAt_asc">Cũ nhất</option>
                        <option value="price_asc">Giá tăng dần</option>
                        <option value="price_desc">Giá giảm dần</option>
                        <option value="name_asc">Tên A → Z</option>
                    </select>

                    <div class="page-toolbar__spacer"></div>

                    <button type="button" class="btn btn--ghost" id="btn-manage-categories">Quản lý danh mục</button>
                    <button type="button" class="btn btn--primary" id="btn-add-product">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2"
                                stroke-linecap="round" />
                        </svg>
                        Thêm sản phẩm
                    </button>
                </div>

                <!-- ---- Bảng sản phẩm ---- -->
                <div class="card card--flush">
                    <div class="table-toolbar" style="padding: 20px 20px 0;">
                        <div class="table-toolbar__count">
                            Hiển thị <strong id="product-count-shown">0</strong> / <strong
                                id="product-count-total">0</strong> sản phẩm
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Sản phẩm</th>
                                    <th>Danh mục</th>
                                    <th>Giá bán</th>
                                    <th>Kho</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="products-table-body">
                                <tr>
                                    <td colspan="6">
                                        <div class="skeleton" style="height: 20px;"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination" style="margin: 0 20px 20px;">
                        <div class="pagination__info" id="pagination-info">Trang 1</div>
                        <div class="pagination__controls" id="pagination-controls"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/entry.js"></script>
</body>

</html>
