<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tổng quan · ShopAdmin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body data-page="dashboard">
    <div class="app-shell">
        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar" id="sidebar"></aside>

        <!-- ==================== MAIN ==================== -->
        <div class="main">
            <header class="header">
                <div>
                    <div class="header__title">Tổng quan</div>
                    <div class="header__subtitle">Xin chào, đây là tình hình kinh doanh hôm nay.</div>
                </div>

                <div class="header__actions">
                    <button class="header__icon-btn" aria-label="Thông báo">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                        <span class="dot"></span>
                    </button>
                </div>
            </header>

            <div class="content">
                <!-- ---- Stat cards ---- -->
                <div class="stat-grid" id="stat-grid">
                    <div class="stat-card">
                        <div class="stat-card__top">
                            <div class="stat-card__icon stat-card__icon--blue">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <path
                                        d="M20.59 13.41L11 3.83A2 2 0 009.59 3.24H4a1 1 0 00-1 1v5.59a2 2 0 00.59 1.41l9.58 9.59a2 2 0 002.83 0l5.59-5.59a2 2 0 000-2.83z"
                                        stroke="currentColor" stroke-width="2" />
                                </svg>
                            </div>
                            <span class="stat-card__trend stat-card__trend--up" id="trend-products">—</span>
                        </div>
                        <div class="stat-card__value" id="stat-products">
                            <div class="skeleton" style="width: 60px; height: 26px;"></div>
                        </div>
                        <div class="stat-card__label">Tổng sản phẩm</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card__top">
                            <div class="stat-card__icon stat-card__icon--purple">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor"
                                        stroke-width="2" />
                                    <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2" />
                                </svg>
                            </div>
                            <span class="stat-card__trend stat-card__trend--up" id="trend-customers">—</span>
                        </div>
                        <div class="stat-card__value" id="stat-customers">
                            <div class="skeleton" style="width: 60px; height: 26px;"></div>
                        </div>
                        <div class="stat-card__label">Tổng khách hàng</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card__top">
                            <div class="stat-card__icon stat-card__icon--amber">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="currentColor"
                                        stroke-width="2" />
                                    <path d="M3 6h18M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" />
                                </svg>
                            </div>
                            <span class="stat-card__trend stat-card__trend--up" id="trend-orders">—</span>
                        </div>
                        <div class="stat-card__value" id="stat-orders">
                            <div class="skeleton" style="width: 60px; height: 26px;"></div>
                        </div>
                        <div class="stat-card__label">Tổng đơn hàng</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card__top">
                            <div class="stat-card__icon stat-card__icon--green">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                </svg>
                            </div>
                            <span class="stat-card__trend stat-card__trend--up" id="trend-revenue">—</span>
                        </div>
                        <div class="stat-card__value" id="stat-revenue">
                            <div class="skeleton" style="width: 90px; height: 26px;"></div>
                        </div>
                        <div class="stat-card__label">Doanh thu</div>
                    </div>
                </div>

                <!-- ---- Chart + hoạt động đang chạy ---- -->
                <div class="dash-grid">
                    <div class="card">
                        <div class="card__header">
                            <div>
                                <div class="card__title">Biểu đồ doanh thu</div>
                                <div class="card__subtitle">12 tháng gần nhất</div>
                            </div>
                            <div class="chart-legend">
                                <div class="chart-legend__item"><span class="chart-legend__dot"></span> Doanh thu</div>
                            </div>
                        </div>
                        <div class="chart-canvas-wrap">
                            <canvas id="revenue-chart"></canvas>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card__header">
                            <div>
                                <div class="card__title">Đang hoạt động</div>
                                <div class="card__subtitle">Voucher &amp; Flash Sale</div>
                            </div>
                        </div>
                        <div class="mini-list" id="activity-list">
                            <div class="skeleton" style="height: 58px;"></div>
                            <div class="skeleton" style="height: 58px;"></div>
                            <div class="skeleton" style="height: 58px;"></div>
                        </div>
                    </div>
                </div>

                <!-- ---- Đơn hàng mới nhất + Top sản phẩm ---- -->
                <div class="dash-grid--secondary">
                    <div class="card card--flush">
                        <div class="card__header" style="padding: 20px 20px 0;">
                            <div>
                                <div class="card__title">5 đơn hàng mới nhất</div>
                            </div>
                        </div>
                        <div class="table-wrap">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Mã đơn</th>
                                        <th>Khách hàng</th>
                                        <th>Giá trị</th>
                                        <th>Trạng thái</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-orders-body">
                                    <tr>
                                        <td colspan="4">
                                            <div class="skeleton" style="height: 20px;"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card__header">
                            <div class="card__title">Top sản phẩm bán chạy</div>
                        </div>
                        <div id="top-products-list">
                            <div class="skeleton" style="height: 56px; margin-bottom: 10px;"></div>
                            <div class="skeleton" style="height: 56px; margin-bottom: 10px;"></div>
                            <div class="skeleton" style="height: 56px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/entry.js"></script>
</body>

</html>
